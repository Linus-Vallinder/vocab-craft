name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        id: version
        run: |
          base=$(grep '^version=' gradle.properties | cut -d= -f2)
          minecraft=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          short=$(git rev-parse --short=7 HEAD)
          echo "version=${base}+${short}" >> "$GITHUB_OUTPUT"
          echo "minecraft=${minecraft}" >> "$GITHUB_OUTPUT"

      - name: Test and build
        run: ./gradlew test build -Pversion="${{ steps.version.outputs.version }}"

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: vocab-craft
          path: build/libs/vocab-craft-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Check Modrinth config
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          if [ -n "$MODRINTH_TOKEN" ] && [ -n "$MODRINTH_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Modrinth publish skipped. Add the MODRINTH_TOKEN secret and the MODRINTH_PROJECT_ID variable, then push again."
          fi

      - name: Changelog
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.modrinth.outputs.ready == 'true'
        run: git log -1 --format=%B > build/modrinth-changelog.txt

      - name: Publish to Modrinth
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.modrinth.outputs.ready == 'true'
        uses: Kira-NT/mc-publish@v3.3.2
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          files: build/libs/vocab-craft-${{ steps.version.outputs.version }}.jar
          name: ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: beta
          changelog-file: build/modrinth-changelog.txt
          loaders: fabric
          game-versions: ${{ steps.version.outputs.minecraft }}
          game-version-filter: releases
          java: "25"
          dependencies: fabric-api(required){modrinth:P7dR8mSH}
